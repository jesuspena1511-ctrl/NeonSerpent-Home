            color: #a0a0c0;

        }

            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .card h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #00ff88;
        }

        .card p {

            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8),
                        0 0 60px rgba(0, 255, 136, 0.4);
            background: linear-gradient(135deg, #1aff99 0%, #00cc66 100%);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #606080;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 136, 0.05);
        }
    </style>
